[package]
name = "airdroppe-cli"
version = "0.1.0"
edition = "2024"
description = "Terminal interface for airdroppe"
authors = ["Logan-010"]

[dependencies]
airdroppe-core = { workspace = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
iroh-blobs = { version = "0.103.1", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

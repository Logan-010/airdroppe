[package]
name = "airdroppe-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
ciborium = "0.2.2"
color-eyre = "0.6.5"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
iroh = { version = "1.4.1", default-features = false, features = ["portmapper", "tls-aws-lc-rs"] }
iroh-blobs = "0.103.1"
iroh-dns = "1.4.1"
iroh-mdns-address-lookup = "0.6.1"
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
rustls = { version = "0.23.46", default-features = false, features = ["prefer-post-quantum"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread"] }
tracing = "0.1.44"
url = "2.5.8"
